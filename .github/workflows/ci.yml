name: CI

# `development` is where work integrates and `main` is what deploys, so both
# are gated: a pull request into either one runs the suite, and so does the
# merge commit that lands on it.
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# A force-push or a second commit makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `cargo fmt --check` needs no compile at all, so a formatting failure is
  # reported in seconds rather than after the crate and its dependency tree —
  # which includes `diffpack-engine` and the whole of `vercel_runtime` — have
  # been built. `--all` covers `api/` and `tests/` as well as `src/`.
  #
  # When this fails: `cargo fmt --all`, and commit.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `rustup show` installs whatever `rust-toolchain.toml` pins, components
      # included. Pinning the action to `stable` instead would put a second
      # version number in a second place and let CI and Vercel's build
      # container drift apart without anyone noticing.
      - run: rustup show
      - run: cargo fmt --all --check

  # The four jobs below each run one check out of `scripts/checks.sh`, which is
  # also what the `pre-commit` hook in `.githooks/` runs. Neither place spells
  # the command out, so a flag added to a check is added to both and a commit
  # that passed locally cannot be failed here by a difference in arguments.
  # They stay separate jobs rather than one `./scripts/checks.sh` invocation so
  # that a failure names itself in the checks list, and so the slow ones do not
  # queue behind each other.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/checks.sh clippy

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/checks.sh test

  # Advisories, licenses, banned crates and — the one that matters most for a
  # server that fetches archives — where the code came from. `deny.toml` says
  # what is allowed and why.
  #
  # No toolchain: cargo-deny reads `Cargo.lock` and the manifests rather than
  # compiling anything, so this reports in well under a minute and does not
  # wait on the dependency graph being built.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Prebuilt binaries. `cargo install` would compile cargo-deny itself on
      # every run, which costs minutes to learn the same thing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ./scripts/checks.sh deny

  # The second opinion on advisories: the same RustSec database, read without
  # `deny.toml`. It is here to disagree — an advisory ignored in `deny.toml`
  # for a reason that has since expired shows up as this job going red while
  # `deny` stays green, which is the signal to go and read the ignore.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: ./scripts/checks.sh audit

  # The cache key is a contract with a codebase written in another language
  # (#27), so `fixtures/cache-key-vectors.json` has to stay a fixed target. A
  # vector file edited to match a changed implementation would let the two
  # sides drift while both their suites stayed green, which is the one failure
  # mode the vectors exist to prevent. Flag it for a human; do not fail on it.
  vectors:
    name: cache-key vectors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Warn if the vectors changed
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- fixtures/cache-key-vectors.json; then
            echo "vectors unchanged"
            exit 0
          fi
          {
            echo '## Cache-key vectors changed'
            echo ''
            echo 'This PR edits `fixtures/cache-key-vectors.json`. Those values are'
            echo 'the contract with the TypeScript reader in `diffpack` (#27) and must'
            echo 'come from `docs/cache-key.md`, not from running the Rust.'
            echo ''
            echo 'If this is a deliberate change to the key, `docs/cache-key.md`'
            echo 'should change in the same PR and the `schema` field should move.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning file=fixtures/cache-key-vectors.json::Cache-key vectors changed - confirm they came from docs/cache-key.md"

  # `src/engine.rs` is the only module allowed to import `diffpack_engine`.
  # Its own job because it needs no toolchain and no compile.
  seam:
    name: engine seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-engine-seam.sh
