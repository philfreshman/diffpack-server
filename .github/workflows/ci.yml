name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: ./scripts/checks.sh fmt

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/checks.sh clippy

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/checks.sh test

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ./scripts/checks.sh deny

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: ./scripts/checks.sh audit

  vectors:
    name: cache-key vectors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Warn if the vectors changed
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- fixtures/cache-key-vectors.json; then
            echo "vectors unchanged"
            exit 0
          fi
          {
            echo '## Cache-key vectors changed'
            echo ''
            echo 'This PR edits `fixtures/cache-key-vectors.json`. Those values are'
            echo 'the contract with the TypeScript reader in `diffpack` (#27) and must'
            echo 'come from `docs/cache-key.md`, not from running the Rust.'
            echo ''
            echo 'If this is a deliberate change to the key, `docs/cache-key.md`'
            echo 'should change in the same PR and the `schema` field should move.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning file=fixtures/cache-key-vectors.json::Cache-key vectors changed - confirm they came from docs/cache-key.md"

  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - run: ./scripts/checks.sh conformance

  seams:
    name: module seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/checks.sh seams
