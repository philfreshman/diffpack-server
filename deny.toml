[graph]
all-features = true

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip 8 via diffpack-engine; fixed only in zip 9. The engine reads entries into memory with by_index and never calls extract, which these advisories are about." },
  { id = "RUSTSEC-2026-0368", reason = "zip 8 via diffpack-engine; fixed only in zip 9. The engine reads entries into memory with by_index and never calls extract, which these advisories are about." },
  { id = "RUSTSEC-2026-0369", reason = "zip 8 via diffpack-engine; fixed only in zip 9. The engine reads entries into memory with by_index and never calls extract, which these advisories are about." },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true
ignore-sources = ["https://github.com/philfreshman/diffpack-engine.git"]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/philfreshman/diffpack-engine"]
