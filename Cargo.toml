[package]
name = "diffpack-server"
version = "0.1.0"
edition = "2021"
description = "An MCP server exposing diffpack-engine's package diffing as tools an agent can call."
repository = "https://github.com/philfreshman/diffpack-server"
publish = false

# Vercel's Rust runtime fixes this layout: every handler is a `[[bin]]` whose
# path is a file under `api/`, and `vercel.json` rewrites all traffic to it.
# So the binary stays a thin entry point and everything worth testing lives in
# the library beside it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[dependencies]
# The router `api/mcp.rs` mounts both `/health` and `rmcp`'s tower service on.
# `vercel_runtime`'s axum integration is built against 0.8, so the major is
# theirs to choose, not ours. Default features off because this is one
# serverless function and not a web framework: no `http2` (Vercel speaks
# HTTP/1.1 to the function), no `ws`, no `multipart`, no `tracing`.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# The diff handle's payload, base64url-encoded so that an agent carrying one
# between calls has nothing in front of it that looks editable — see
# `src/handle.rs`. Already in the graph as a transitive dependency; naming it
# here adds a line to this file and no code to the binary. Decoding is where
# base64 is fiddly (alphabet, padding, the bits a short group leaves over),
# which is the part worth not writing again.
base64 = "0.22"
# Pinned to a tag, not a branch: a branch would make the build
# unreproducible, and the engine version is a field in the cache key. The
# crate is not published to crates.io, so a git dependency is the only
# option. `src/engine.rs` is the only module allowed to import it, and
# `engine::VERSION` must agree with this tag — `tests/engine.rs` checks.
diffpack-engine = { git = "https://github.com/philfreshman/diffpack-engine.git", tag = "v0.3.0" }
# Two things. `FutureExt::catch_unwind` turns a panic in a handler into a
# JSON-RPC error: rmcp runs handlers on a task of its own, so a tower layer
# never sees that unwind and the request hangs instead of failing. See
# `mcp::Guarded`. And `try_join!`, for a tool comparing two versions: it
# waits on the network twice and the two waits do not depend on each other.
# That second use is why `scripts/check-tool-seams.sh` names this crate on
# the list a tool may import.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# The HTTP client behind `src/fetch.rs` and `src/store/`, and named by nothing
# else: a tool never names it, and `scripts/check-tool-seams.sh` fails the
# build if one does. Those two build a client each rather than sharing one,
# because `fetch`'s policy is a set of rules about a registry's servers — which
# hosts, which redirects, what a `404` means — and none of them is a rule about
# a blob store this project owns.
#
# Default features off, because what this server does is ask a few known hosts
# for bytes — no cookies, no JSON (the store's two response shapes go through
# `serde_json` like everything else here), no multipart, no proxy discovery.
#
# `gzip` is the one exception and it arrived with #19. This note used to say
# no compression negotiation at all, on the grounds that an archive is
# compressed already — true, and it stopped being the whole story when the
# search source chosen for PyPI turned out to be the index it publishes:
# 44 MB raw and 25 s against a 30 s upstream timeout, against 9.7 MB and 4.4 s
# compressed.
#
# Switching the feature on would have negotiated it for every request the
# client makes, because that is what the feature does to a request that names
# no encoding. So `src/fetch.rs` names one — `identity` — for every caller but
# the one that asked, and the archive path is byte for byte the request it was.
# The reason to keep it that way is the size cap: the running total is counted
# on decoded chunks either way, but the cheap half, refusing a body on its
# declared length before reading one, does not survive a body the client
# decodes, and an archive is the body most worth refusing unread.
#
# `rustls-no-provider` rather than `rustls`: the default provider is
# `aws-lc-rs`, which wants a C toolchain at build time and carries the OpenSSL
# license. `src/fetch.rs` installs `ring` instead — the install is
# process-wide and only the first caller wins, so `src/store/` makes the same
# call and neither has to know which ran first — which is why `rustls` is
# named below as a dependency of ours rather than only of reqwest's.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls-no-provider"] }
# The official MCP SDK, and the reason this crate does not hand-roll a
# protocol. It implements revision `2026-07-28` while still answering clients
# on `2025-11-25` and earlier, which is what makes one endpoint serve every
# client we care about.
#
# `transport-streamable-http-server` is the Streamable HTTP transport as a
# tower `Service`, so it composes with axum directly. No client features: this
# crate is a server.
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
# Named here for one line of code, written once per client: the provider
# install in `src/fetch.rs` and the same call in `src/store/`, of which only
# the first to run does anything. Which cryptography rustls uses has no
# default and is the depending crate's choice, so it has to be made somewhere,
# and making it here keeps `ring` in the manifest where a reader looking for
# what this server links against will find it. The version is rustls's own,
# kept in step with the one reqwest resolves so that the `CryptoProvider`
# installed is the type reqwest asks for.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Input and output schemas, derived from the types a tool handler actually
# reads and returns rather than written out beside them — see `src/tools`. It
# is already in the graph as rmcp's own dependency and the version is kept in
# step with rmcp's so that `JsonSchema` here is the same trait rmcp asks for;
# if the two ever diverge the compiler says so rather than the schemas
# quietly disagreeing.
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `Layer`, so `api/mcp.rs` can wrap the router in `VercelLayer`. Nothing else
# from it — the middleware this crate writes itself is an axum
# `map_response`, and the middleware it does not is `tower-http` below.
tower = "0.5.3"
# `catch-panic` alone. A panic in a handler would otherwise unwind into the
# connection task `vercel_runtime` spawns, and the client would see a dropped
# connection rather than an answer — worse than a 500, because there is
# nothing in it to act on. #7 turns that into a JSON-RPC error.
tower-http = { version = "0.7.1", features = ["catch-panic"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
# Reading a response body back out in the HTTP tests.
http-body-util = "0.1.5"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
toml = "0.9"
# `ServiceExt::oneshot`, which is how the tests drive the router: a real
# request in, a real response out, without binding a port.
tower = { version = "0.5.3", features = ["util"] }

# Vercel's Rust template. A handler is built once and invoked many times, so
# the build is allowed to be slow: one codegen unit and fat LTO across the
# whole graph, at the highest optimisation level.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
