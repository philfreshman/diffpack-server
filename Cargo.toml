[package]
name = "diffpack-server"
version = "0.1.0"
edition = "2021"
description = "An MCP server exposing diffpack-engine's package diffing as tools an agent can call."
repository = "https://github.com/philfreshman/diffpack-server"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
diffpack-engine = { git = "https://github.com/philfreshman/diffpack-engine.git", tag = "v0.3.0" }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls-no-provider"] }
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
toml = "0.9"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
