[package]
name = "diffpack-server"
version = "0.1.0"
edition = "2021"
description = "An MCP server exposing diffpack-engine's package diffing as tools an agent can call."
repository = "https://github.com/philfreshman/diffpack-server"
publish = false

# Vercel's Rust runtime fixes this layout: every handler is a `[[bin]]` whose
# path is a file under `api/`, and `vercel.json` rewrites all traffic to it.
# So the binary stays a thin entry point and everything worth testing lives in
# the library beside it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[dependencies]
# Pinned to a tag, not a branch: a branch would make the build
# unreproducible, and the engine version is a field in the cache key. The
# crate is not published to crates.io, so a git dependency is the only
# option. `src/engine.rs` is the only module allowed to import it, and
# `engine::VERSION` must agree with this tag — `tests/engine.rs` checks.
diffpack-engine = { git = "https://github.com/philfreshman/diffpack-engine.git", tag = "v0.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vercel_runtime = "2.4"

[dev-dependencies]
toml = "0.9"

# Vercel's Rust template. A handler is built once and invoked many times, so
# the build is allowed to be slow: one codegen unit and fat LTO across the
# whole graph, at the highest optimisation level.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
